<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Responsive timeline: desktop=50% width, mobile=fill remaining space beside chatbot -->
    <title>TempleGate Immersive 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Inter', sans-serif; }
        canvas { display: block; }
        
        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }
        
        .timeline-node {
            position: relative;
            width: 14px;
            height: 14px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s ease;
            pointer-events: auto;
            border: 10px solid transparent; /* Massive invisible hit area */
            background-clip: padding-box;
            z-index: 100;
        }
        .timeline-node.active {
            background: #ff7e33;
            box-shadow: 0 0 15px #ff7e33;
            transform: scale(1.3);
        }
        .timeline-node::after {
            content: attr(data-label);
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
        }
        .timeline-node.active::after { color: #ff7e33; }

        #ar-video { background: #000; }

        /* ── Chatbot Panel ── */
        #chatbot-panel {
            position: fixed;
            bottom: 80px;   /* sits just above the FAB (44px) + gap + padding */
            right: 24px;    /* matches the p-6 padding of the UI overlay */
            width: 300px;
            max-height: 440px;
            background: rgba(15,10,5,0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,180,80,0.25);
            border-radius: 20px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 12px 48px rgba(0,0,0,0.7);
            z-index: 9999;
            animation: slideUp 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        #chatbot-panel.open { display: flex; }

        @keyframes slideUp {
            from { opacity:0; transform: translateY(20px); }
            to   { opacity:1; transform: translateY(0); }
        }
        .bot-avatar {
            width:36px; height:36px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:18px; flex-shrink:0;
        }
        .persona-chip {
            padding:4px 10px; border-radius:20px; font-size:11px;
            font-weight:600; cursor:pointer; border:1px solid rgba(255,180,80,0.3);
            background:rgba(255,180,80,0.08); color:rgba(255,220,140,0.85);
            transition:all 0.2s; white-space:nowrap;
        }
        .persona-chip.selected { background:rgba(255,150,30,0.3); border-color:#ff9620; color:#ffcc80; }
        .q-chip {
            padding:5px 10px; border-radius:14px; font-size:10px;
            cursor:pointer; background:rgba(255,180,60,0.1);
            border:1px solid rgba(255,180,60,0.25); color:#ffd080;
            white-space:nowrap; transition:all 0.2s;
        }
        .q-chip:active { background:rgba(255,150,30,0.3); }
        #chat-messages { overflow-y:auto; scrollbar-width:none; }
        #chat-messages::-webkit-scrollbar { display:none; }
        .msg-bot, .msg-user {
            max-width:85%; padding:8px 12px; border-radius:14px;
            font-size:12px; line-height:1.5;
        }
        .msg-bot {
            background:rgba(255,160,50,0.12); color:#ffd5a0;
            border:1px solid rgba(255,160,50,0.2); border-bottom-left-radius:4px;
        }
        .msg-user {
            background:rgba(255,255,255,0.08); color:#e0e0e0;
            margin-left:auto; border-bottom-right-radius:4px;
        }
        #chat-input {
            background:rgba(255,255,255,0.06); border:1px solid rgba(255,180,80,0.2);
            border-radius:20px; color:#fff; font-size:12px;
            padding:8px 12px; outline:none; flex:1;
        }
        #chat-input::placeholder { color:rgba(255,255,255,0.3); }

        /* ── Audio Narrator Panel ── */
        #audio-lang-panel {
            position: absolute;
            top: 56px;
            right: 0;
            width: 200px;
            background: rgba(15,10,5,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,180,80,0.25);
            border-radius: 16px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 12px 48px rgba(0,0,0,0.7);
            z-index: 10000;
            animation: slideUp 0.25s cubic-bezier(0.4,0,0.2,1);
            pointer-events: auto; /* Ensure clicks work inside the panel */
        }
        #audio-lang-panel.open { display: flex; }

        .lang-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            color: rgba(255,220,180,0.8);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .lang-option:last-child { border-bottom: none; }
        .lang-option:hover { background: rgba(255,150,30,0.15); }
        .lang-option.active {
            background: rgba(255,150,30,0.2);
            color: #ffcc80;
        }
        .lang-option .lang-flag { font-size: 18px; }
        .lang-option .lang-check {
            margin-left: auto;
            font-size: 16px;
            color: #ff9620;
            display: none;
        }
        .lang-option.active .lang-check { display: inline; }

        /* Narration status indicator */
        #narration-status {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15,10,5,0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,180,80,0.2);
            border-radius: 24px;
            padding: 8px 20px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 9998;
            animation: slideUp 0.3s ease;
        }
        #narration-status.visible { display: flex; }

        .audio-wave {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 16px;
        }
        .audio-wave span {
            width: 3px;
            background: #ff9620;
            border-radius: 2px;
            animation: wave 0.8s ease-in-out infinite;
        }
        .audio-wave span:nth-child(1) { height: 6px; animation-delay: 0s; }
        .audio-wave span:nth-child(2) { height: 12px; animation-delay: 0.1s; }
        .audio-wave span:nth-child(3) { height: 8px; animation-delay: 0.2s; }
        .audio-wave span:nth-child(4) { height: 14px; animation-delay: 0.3s; }
        .audio-wave span:nth-child(5) { height: 6px; animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.2); }
        }

        /* ── Splash Overlay ── */
        #splash-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: linear-gradient(160deg, #0f0a05 0%, #1a1008 40%, #0d0d0d 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1), transform 0.8s cubic-bezier(0.4,0,0.2,1);
        }
        #splash-overlay.fade-out {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .splash-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,150,30,0.15), rgba(255,100,0,0.08));
            border: 1px solid rgba(255,180,80,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            animation: splashPulse 2.5s ease-in-out infinite;
        }
        @keyframes splashPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,150,30,0.3); }
            50% { box-shadow: 0 0 0 20px rgba(255,150,30,0); }
        }

        .splash-title {
            font-size: 36px;
            font-weight: 300;
            color: rgba(255,220,180,0.95);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .splash-subtitle {
            font-size: 14px;
            color: rgba(255,200,140,0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 48px;
        }

        .splash-begin-btn {
            position: relative;
            padding: 16px 48px;
            border: 1px solid rgba(255,180,80,0.3);
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(255,150,30,0.12), rgba(255,100,0,0.06));
            color: #ffcc80;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden;
        }
        .splash-begin-btn:hover {
            background: linear-gradient(135deg, rgba(255,150,30,0.25), rgba(255,100,0,0.15));
            border-color: rgba(255,180,80,0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(255,150,30,0.2);
        }
        .splash-begin-btn:active {
            transform: translateY(0) scale(0.97);
        }
        .splash-begin-btn .btn-shimmer {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,200,100,0.1), transparent);
            animation: shimmer 2.5s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .splash-hint {
            margin-top: 24px;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Decorative particles on splash */
        .splash-particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .splash-particles span {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255,180,80,0.3);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }

        /* Hide UI overlay until journey begins */
        .ui-hidden { opacity: 0; pointer-events: none !important; }
        .ui-visible { opacity: 1; transition: opacity 0.6s ease 0.3s; }
    </style>
</head>
<body>

    <!-- ═══ Splash Overlay ═══ -->
    <div id="splash-overlay">
        <!-- Floating particles -->
        <div class="splash-particles" id="splash-particles"></div>

        <div class="splash-icon">
            <span class="material-symbols-outlined" style="font-size:36px; color:#ff9620; font-variation-settings:'FILL' 1">temple_hindu</span>
        </div>

        <h1 class="splash-title" id="splash-temple-name">Brihadeeswarar Temple</h1>
        <p class="splash-subtitle" id="splash-temple-location">Thanjavur, Tamil Nadu</p>

        <button class="splash-begin-btn" id="begin-journey-btn" onclick="beginJourney()">
            <span class="btn-shimmer"></span>
            Begin Discovery
        </button>

        <div class="splash-hint">
            <span class="material-symbols-outlined" style="font-size:14px">volume_up</span>
            Audio narration will begin automatically
        </div>
    </div>

    <!-- Camera Overlay for AR -->
    <video id="ar-video" class="fixed inset-0 w-full h-full object-cover z-0 hidden" autoplay playsinline></video>

    <!-- UI Overlay (hidden until journey begins) -->
    <div id="ui-overlay" class="fixed inset-0 pointer-events-none z-50 flex flex-col justify-between p-6 ui-hidden">
        
        <!-- Top Bar -->
        <div class="flex justify-between items-start w-full">
            <button onclick="handleBack()" class="pointer-events-auto glass-btn p-3 rounded-full text-white">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            
            <div class="flex flex-col gap-4">
                <button id="space-toggle" class="pointer-events-auto glass-btn p-3 rounded-full text-white" title="View in Space">
                    <span class="material-symbols-outlined">rocket_launch</span>
                </button>
                <button id="ar-toggle" class="pointer-events-auto glass-btn p-3 rounded-full text-white">
                    <span class="material-symbols-outlined">center_focus_weak</span>
                </button>

                <!-- Audio Narrator Button -->
                <div class="relative">
                    <button id="audio-toggle" class="pointer-events-auto glass-btn p-3 rounded-full text-white" title="Audio Narrator">
                        <span class="material-symbols-outlined" id="audio-icon">volume_up</span>
                    </button>
                    <!-- Language Selector Dropdown -->
                    <div id="audio-lang-panel">
                        <div class="px-4 py-2 border-b border-white/10">
                            <div class="text-[10px] font-semibold text-amber-400 uppercase tracking-widest">Narration Language</div>
                        </div>
                        <div id="lang-options-list">
                            <!-- Populated dynamically -->
                        </div>
                        <div class="px-4 py-2 border-t border-white/10 flex gap-2">
                            <button id="narration-play-pause" onclick="narrator.togglePlayPause()" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 transition-all">
                                ⏸ Pause
                            </button>
                            <button onclick="narrator.stop()" class="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-red-500/15 text-red-300 hover:bg-red-500/25 transition-all">
                                ⏹ Stop
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Row: mobile=flex-row, desktop=centered timeline + absolute chatbot -->
        <div class="w-full relative flex items-end gap-3 pb-2 md:justify-center">

            <!-- Timeline: flex-1 on mobile, natural centered width on desktop -->
            <div id="timeline-bar"
                 class="pointer-events-auto glass-btn rounded-full flex items-center justify-between relative"
                 style="flex:1; padding:18px 32px; min-width:0; max-width:340px;">
                <div class="absolute" style="left:32px;right:32px;top:50%;height:1px;background:rgba(255,255,255,0.15)"></div>
                <div class="timeline-node" data-phase="0" data-label="Ancient"></div>
                <div class="timeline-node" data-phase="1" data-label="Middle"></div>
                <div class="timeline-node active" data-phase="2" data-label="Now"></div>
            </div>

            <!-- Chatbot: inline on mobile (flex child), absolute on desktop (out of flow) -->
            <div class="pointer-events-auto flex flex-col items-end gap-2
                        md:absolute md:right-0 md:bottom-0"
                 style="flex-shrink:0">

                <!-- Chat Panel -->
                <div id="chatbot-panel">
                    <!-- Header -->
                    <div class="flex items-center gap-2 px-4 py-3 border-b border-white/10">
                        <div id="bot-avatar" class="bot-avatar" style="background:rgba(255,150,30,0.2)">🕉️</div>
                        <div class="flex-1">
                            <div id="bot-name" class="text-xs font-semibold text-amber-300">Rishi Veda</div>
                            <div class="text-[9px] text-white/40">Ancient Sage · Online</div>
                        </div>
                        <button onclick="toggleChat()" class="text-white/30 hover:text-white text-lg leading-none">✕</button>
                    </div>

                    <!-- Persona Selector -->
                    <div class="flex gap-2 px-3 py-2 overflow-x-auto" style="scrollbar-width:none">
                        <div class="persona-chip selected" data-persona="0" onclick="switchPersona(0)">🕉️ Sage</div>
                        <div class="persona-chip" data-persona="1" onclick="switchPersona(1)">🪔 Priest</div>
                        <div class="persona-chip" data-persona="2" onclick="switchPersona(2)">💃 Dancer</div>
                        <div class="persona-chip" data-persona="3" onclick="switchPersona(3)">📜 Historian</div>
                    </div>

                    <!-- Messages -->
                    <div id="chat-messages" class="flex flex-col gap-2 px-3 py-2" style="flex:1;max-height:180px"></div>

                    <!-- Quick Questions -->
                    <div id="quick-qs" class="flex gap-2 px-3 py-2 overflow-x-auto" style="scrollbar-width:none"></div>

                    <!-- Input -->
                    <div class="flex gap-2 px-3 pb-3">
                        <input id="chat-input" placeholder="Ask about temples..." onkeydown="if(event.key==='Enter')sendMsg()">
                        <button onclick="sendMsg()" class="text-amber-400 hover:text-amber-300 px-1">➤</button>
                    </div>
                </div>

                <!-- FAB Button -->
                <button id="chatbot-fab" onclick="toggleChat()"
                        class="w-11 h-11 rounded-full flex items-center justify-center shadow-lg transition-all active:scale-90"
                        style="background:linear-gradient(135deg,#ff9620,#c25a00);box-shadow:0 4px 20px rgba(255,150,30,0.4)">
                    <span style="font-size:20px">🤖</span>
                </button>
            </div>

        </div>


    </div>

    <!-- Narration Status Bar -->
    <div id="narration-status">
        <div class="audio-wave">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span id="narration-status-text" class="text-xs text-amber-200/80 font-medium">Narrating...</span>
    </div>

    <!-- Three.js Setup -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls, templeGroup;
        let currentPhase = 2;
        let isAutoRotating = true;
        let isSpaceMode = false;
        let starField;
        let floatTime = 0;
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.xr.enabled = true; // Enable WebXR
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffcc88, 1.2);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            const backLight = new THREE.PointLight(0x4444ff, 0.5);
            backLight.position.set(-5, 2, -5);
            scene.add(backLight);

            // Temple Creation
            templeGroup = new THREE.Group();
            createTemple();
            scene.add(templeGroup);

            camera.position.set(10, 6, 12);
            
            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // Stop auto-rotate on interaction
            controls.addEventListener('start', () => { 
                isAutoRotating = false; 
                controls.autoRotate = false; 
            });
            
            animate();
            // Performance Audit
            auditPerformance();
        }

        function auditPerformance() {
            let totalPolygons = 0;
            scene.traverse((obj) => {
                if (obj.isMesh && obj.geometry) {
                    const geometry = obj.geometry;
                    const count = geometry.index ? geometry.index.count : geometry.attributes.position.count;
                    totalPolygons += count / 3;
                }
            });
            console.log("=== Performance Audit ===");
            console.log(`Total Polygon Count: ${Math.round(totalPolygons)}`);
            console.log(`Renderer Info (Geometries): ${renderer.info.memory.geometries}`);
            console.log(`Renderer Info (Textures): ${renderer.info.memory.textures}`);
            console.log(`Draw Calls: ${renderer.info.render.calls}`);
            console.log("=========================");
        }


        function createTemple() {
            // Clear previous
            while(templeGroup.children.length > 0) templeGroup.remove(templeGroup.children[0]);

            const stoneMat = new THREE.MeshPhongMaterial({ 
                color: 0x8b7355, 
                flatShading: true,
                shininess: 5
            });

            const detailMat = new THREE.MeshPhongMaterial({ 
                color: 0x5d4a36,
                flatShading: true
            });

            // 1. The Main Mandapa (Long Hall)
            const mandapaGeom = new THREE.BoxGeometry(8, 1.5, 3.5);
            const mandapa = new THREE.Mesh(mandapaGeom, stoneMat);
            mandapa.position.x = -2;
            templeGroup.add(mandapa);

            // 2. The Pillars (Side)
            for(let i = -5; i <= 1; i += 1.5) {
                const pillarGeom = new THREE.CylinderGeometry(0.15, 0.2, 1.2, 8);
                const p1 = new THREE.Mesh(pillarGeom, detailMat);
                p1.position.set(i, -0.15, 1.6);
                templeGroup.add(p1);

                const p2 = p1.clone();
                p2.position.z = -1.6;
                templeGroup.add(p2);
            }

            // 3. The Vimana (Tower) - Tiered Structure
            const tierCount = 8;
            for(let i = 0; i < tierCount; i++) {
                const size = 3.5 - (i * 0.4);
                const h = 0.8;
                const tierGeom = new THREE.BoxGeometry(size, h, size);
                const tier = new THREE.Mesh(tierGeom, stoneMat);
                tier.position.set(3, 0.75 + (i * 0.7), 0);
                
                // Add minor carvings
                if (i < 5) {
                    const detail = new THREE.Mesh(new THREE.BoxGeometry(size + 0.2, 0.2, size + 0.2), detailMat);
                    detail.position.y = 0.3;
                    tier.add(detail);
                }
                
                templeGroup.add(tier);
            }

            // 4. The Kalasam (Top Peak)
            const kalasamGeom = new THREE.ConeGeometry(0.3, 0.8, 8);
            const kalasamMat = new THREE.MeshPhongMaterial({ color: 0xffd700, shininess: 100 });
            const kalasam = new THREE.Mesh(kalasamGeom, kalasamMat);
            kalasam.position.set(3, 0.75 + (tierCount * 0.7), 0);
            templeGroup.add(kalasam);

            // Center everything
            const box = new THREE.Box3().setFromObject(templeGroup);
            const center = box.getCenter(new THREE.Vector3());
            templeGroup.position.x = -center.x;
            templeGroup.position.y = -center.y;
        }




        function updatePhase(phase) {
            currentPhase = phase;
            
            // Visual feedback on timeline
            document.querySelectorAll('.timeline-node').forEach((node, idx) => {
                node.classList.toggle('active', idx === phase);
            });

            // Adjust 3D Model appearance based on phase
            templeGroup.children.forEach((child) => {
                if (child.material) {
                    if (phase === 0) { // Ancient
                        child.material.color.setHex(0x5a4138);
                        child.material.shininess = 0;
                    } else if (phase === 1) { // Middle
                        child.material.color.setHex(0x8b7355);
                        child.material.shininess = 5;
                    } else { // Now
                        child.material.color.setHex(0xd2b48c);
                        child.material.shininess = 20;
                    }
                }
            });

            // Special effect for Now (Golden Peak)
            const peak = templeGroup.children[templeGroup.children.length - 1];
            if (peak && peak.geometry.type === 'ConeGeometry') {
                peak.material.color.setHex(phase === 2 ? 0xffd700 : 0x8b7355);
                peak.scale.set(phase === 0 ? 0.001 : 1, phase === 0 ? 0.001 : 1, phase === 0 ? 0.001 : 1);
            }

            // Trigger AI narration for the new era (only after user clicks Begin)
            if (journeyStarted && typeof narrator !== 'undefined') {
                narrator.narrateEra(phase);
            }
        }


        function animate() {
            renderer.setAnimationLoop(() => {
                const now = performance.now();
                frameCount++;
                if (now - lastTime >= 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastTime = now;
                    // Optional: log FPS to console every 5 seconds
                    if (Math.random() < 0.05) console.log(`Current FPS: ${fps}`);
                }

                controls.update();
                
                if (isSpaceMode) {
                    floatTime += 0.01;
                    templeGroup.position.y += Math.sin(floatTime) * 0.005;
                    templeGroup.rotation.y += 0.005;
                }

                renderer.render(scene, camera);
            });
        }


        // --- UI Interactions ---

        function handleBack() {
            if (isAR) {
                // If AR is active, toggle it off instead of leaving the page
                arBtn.click();
            } else {
                // Normal navigation to dashboard
                window.location.href = 'temple_dashboard.html';
            }
        }

        // Timeline click
        document.querySelectorAll('.timeline-node').forEach(node => {
            node.onclick = () => updatePhase(parseInt(node.dataset.phase));
        });

        // Space Mode Toggle
        const spaceBtn = document.getElementById('space-toggle');
        spaceBtn.onclick = () => {
            isSpaceMode = !isSpaceMode;
            spaceBtn.classList.toggle('bg-purple-600', isSpaceMode);
            
            if (isSpaceMode) {
                // Background -> Space
                scene.background = new THREE.Color(0x05050a);
                
                // Add Stars
                const starGeo = new THREE.BufferGeometry();
                const starCoords = [];
                for(let i=0; i<5000; i++) {
                    starCoords.push((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100);
                }
                starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
                const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
                starField = new THREE.Points(starGeo, starMat);
                scene.add(starField);
                
                // Floating temple effect
                controls.autoRotate = false;

            } else {
                scene.background = null;
                if (starField) {
                    scene.remove(starField);
                    starField = null;
                }
                templeGroup.position.y = 0;
            }
        };


        // AR Toggle
        const arBtn = document.getElementById('ar-toggle');
        const video = document.getElementById('ar-video');
        let isAR = false;

        arBtn.onclick = async () => {
            if (!isAR) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    video.srcObject = stream;
                    video.classList.remove('hidden');
                    renderer.setClearAlpha(0);
                    isAR = true;
                    arBtn.classList.add('bg-orange-500', 'text-white');
                } catch (err) {
                    alert("Camera access denied or unavailable.");
                }
            } else {
                const stream = video.srcObject;
                if (stream) stream.getTracks().forEach(t => t.stop());
                video.classList.add('hidden');
                renderer.setClearAlpha(1);
                isAR = false;
                arBtn.classList.remove('bg-orange-500');
            }
        };



        // ── Indian Culture Chatbot Logic ──
        const personas = [
            { name:'Rishi Veda', emoji:'🕉️', role:'Ancient Sage',
              color:'rgba(255,150,30,0.2)', greeting:'Namaste 🙏 I am Rishi Veda. Ask me about the Vedic origins of these sacred structures.',
              qs:['What is a Gopuram?','Tell me about Shiva','Why are temples built?'],
              answers:{
                'What is a Gopuram?':'A Gopuram (கோபுரம்) is the majestic gateway tower of a Dravidian temple. Rising up to 13 stories, each tier is adorned with thousands of painted stucco figures depicting deities and epics. 🏛️',
                'Tell me about Shiva':'Lord Shiva, the Mahadeva, is the destroyer and transformer in the Hindu Trinity. In Tamil Nadu, he is worshipped as Nataraja — the Cosmic Dancer whose dance sustains the universe. 💫',
                'Why are temples built?':'Temples are cosmic models of Mount Meru — the mythical centre of the universe. The Vimana (tower) represents the mountain, and the Garbhagriha (sanctum) is the cave at its heart. 🌄'

            },
            { name:'Pujari Ananda', emoji:'🪔', role:'Temple Priest',
              color:'rgba(255,220,80,0.15)', greeting:'Vanakkam! 🪔 I am Pujari Ananda. I will guide you through the rituals and daily life of this sacred temple.',
              qs:['What is Abhishekam?','Daily rituals?','What is prasad?'],
              answers:{
                'What is Abhishekam?':'Abhishekam is the sacred bathing ritual of the deity. The idol is bathed with milk, curd, honey, coconut water and rose water while priests chant Vedic hymns. It purifies and energizes the sanctum. 🫧',

            },
            { name:'Devadasi Meena', emoji:'💃', role:'Classical Dancer',
              color:'rgba(200,80,200,0.15)', greeting:'Namaskaram! 💃 I am Meena, a Bharatanatyam dancer. I will tell you how art and dance are woven into temple life.',
              qs:['What is Bharatanatyam?','Temple art forms?','What are Devadasis?'],
              answers:{
                'What is Bharatanatyam?':'Bharatanatyam is one of the oldest classical dance forms of India, originating in Tamil Nadu. It combines Natya (expression), Nritta (pure dance) and Nritya (expressive dance) — a living prayer in motion. 🌸',

            },
            { name:'Dr. Arjun Kumar', emoji:'📜', role:'Temple Historian',
              color:'rgba(60,180,100,0.15)', greeting:'Hello! 📜 I am Dr. Arjun Kumar. Ask me about the dynasties and history behind these magnificent structures.',
              qs:['Who built Brihadeeswarar?','Chola Dynasty facts','UNESCO temples of TN'],
              answers:{
                'Who built Brihadeeswarar?':'Brihadeeswarar Temple in Thanjavur was built by Raja Raja Chola I, completed in 1010 CE. It is a UNESCO World Heritage Site and one of the largest temples ever built — its 66m Vimana casts no shadow at noon! 🌞',
                'Chola Dynasty facts?':'The Chola Dynasty (9th–13th century CE) was one of the greatest empires of the ancient world. They built over 2,000 temples, developed bronze casting to perfection, and their maritime power extended to Southeast Asia. ⚓',
                'UNESCO temples of TN':'Tamil Nadu has the Great Living Chola Temples as UNESCO sites: Brihadeeswarar (Thanjavur), Gangaikonda Cholapuram, and Airavatesvara Temple. All built between 1000–1150 CE. 🏆'
              }
            }
        ];

        let activePersona = 0;
        let chatOpen = false;

        function toggleChat() {
            chatOpen = !chatOpen;
            const panel = document.getElementById('chatbot-panel');
            panel.classList.toggle('open', chatOpen);
            if (chatOpen && document.getElementById('chat-messages').children.length === 0) {
                switchPersona(0);
            }
        }

        function switchPersona(idx) {
            activePersona = idx;
            const p = personas[idx];
            document.getElementById('bot-name').textContent = p.name;
            document.getElementById('bot-avatar').textContent = p.emoji;
            document.getElementById('bot-avatar').style.background = p.color;
            document.querySelectorAll('.persona-chip').forEach((c,i) => c.classList.toggle('selected', i===idx));
            const msgs = document.getElementById('chat-messages');
            msgs.innerHTML = '';
            addMsg(p.greeting, 'bot');
            renderQuickQs();
        }

        function renderQuickQs() {
            const p = personas[activePersona];
            const qs = document.getElementById('quick-qs');
            qs.innerHTML = p.qs.map(q => `<div class="q-chip" onclick="askQ('${q}')">${q}</div>`).join('');
        }

        function addMsg(text, who) {
            const msgs = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = who === 'bot' ? 'msg-bot' : 'msg-user';
            div.textContent = text;
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
        }

        async function askQ(q) {
            addMsg(q, 'user');
            const p = personas[activePersona];
            
            try {
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: q, persona: p.name })
                });
                const data = await response.json();
                addMsg(data.text, 'bot');
            } catch (err) {
                setTimeout(() => addMsg(p.answers[q] || 'Hmm, let me meditate on that... 🧘', 'bot'), 400);
            }
        }


        async function sendMsg() {
            const inp = document.getElementById('chat-input');
            const txt = inp.value.trim();
            if (!txt) return;
            inp.value = '';
            addMsg(txt, 'user');
            
            const p = personas[activePersona];
            
            try {
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: txt, persona: p.name })
                });
                const data = await response.json();
                addMsg(data.text, 'bot');
            } catch (err) {
                const match = Object.keys(p.answers).find(k => txt.toLowerCase().includes(k.toLowerCase().split(' ')[0]));
                setTimeout(() => addMsg(match ? p.answers[match] : '🙏 That is a profound question. Every stone here holds a story — explore and you shall find the answer.', 'bot'), 500);
            }
        }


        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ── AI Narration Manager ──
        const ERA_MAP_CLIENT = { 0: 'ancient', 1: 'middle', 2: 'modern' };
        const API_BASE = 'http://localhost:3000';
        // Temple ID — will come from URL params in Phase 4, defaults to brihadeeswarar
        const CURRENT_TEMPLE_ID = new URLSearchParams(window.location.search).get('temple') || 'brihadeeswarar';

        class NarrationManager {
            constructor() {
                this.synth = window.speechSynthesis;
                this.currentLang = 'en';
                this.currentSpeechCode = 'en-IN';
                this.isSpeaking = false;
                this.isPaused = false;
                this.currentUtterance = null;
                this.cache = {}; // Cache narrations: { "brihadeeswarar_ancient_en": "text..." }
                this.languages = [
                    { code: 'en', name: 'English', speechCode: 'en-IN', flag: '🇬🇧' },
                    { code: 'ta', name: 'Tamil', speechCode: 'ta-IN', flag: '🇮🇳' },
                    { code: 'hi', name: 'Hindi', speechCode: 'hi-IN', flag: '🇮🇳' },
                    { code: 'te', name: 'Telugu', speechCode: 'te-IN', flag: '🇮🇳' },
                    { code: 'kn', name: 'Kannada', speechCode: 'kn-IN', flag: '🇮🇳' }
                ];
                this.renderLangOptions();
            }

            renderLangOptions() {
                const list = document.getElementById('lang-options-list');
                if (!list) return;
                list.innerHTML = this.languages.map(l => `
                    <div class="lang-option ${l.code === this.currentLang ? 'active' : ''}" 
                         onclick="narrator.switchLanguage('${l.code}', '${l.speechCode}')">
                        <span class="lang-flag">${l.flag}</span>
                        <span>${l.name}</span>
                        <span class="lang-check">✓</span>
                    </div>
                `).join('');
            }

            switchLanguage(langCode, speechCode) {
                this.currentLang = langCode;
                this.currentSpeechCode = speechCode;
                this.renderLangOptions();
                
                // Re-narrate current era in new language
                // Ensure we map the numeric currentPhase to its string key (ancient, middle, modern)
                const eraKey = ERA_MAP_CLIENT[currentPhase];
                this.narrateEra(eraKey);
            }

            async fetchNarration(templeId, eraKey, lang) {
                const cacheKey = `${templeId}_${eraKey}_${lang}`;
                if (this.cache[cacheKey]) {
                    return this.cache[cacheKey];
                }

                try {
                    const url = `${API_BASE}/api/narrative?templeId=${templeId}&era=${eraKey}&lang=${lang}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.text) {
                        this.cache[cacheKey] = data;
                        return data;
                    }
                } catch (err) {
                    console.warn('Narration fetch failed, using fallback:', err);
                }

                // Fallback narration
                return {
                    text: `Welcome to this ancient temple. You are viewing the ${eraKey} era. Explore the magnificent architecture around you.`,
                    speechCode: this.currentSpeechCode,
                    source: 'client-fallback'
                };
            }

            async narrateEra(eraKey) {
                if (!eraKey) return;
                console.log(`[Narrator] Narrating ${eraKey} in ${this.currentLang}...`);
                // Stop any current narration
                this.stop();

                this.showStatus('Fetching narration...');

                const data = await this.fetchNarration(CURRENT_TEMPLE_ID, eraKey, this.currentLang);
                this.speak(data.text, data.speechCode || this.currentSpeechCode);
            }

            speak(text, langCode) {
                this.stop();
                this.isSpeaking = true;
                this.updateUI();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = langCode || this.currentSpeechCode;
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                
                console.log(`[Narrator] Speaking (${utterance.lang}):`, text.substring(0, 50) + "...");
                
                // Show a snippet of the text in the status bar so they can see the language
                this.showStatus(`Narrating (${utterance.lang.split('-')[0].toUpperCase()}): ${text.substring(0, 30)}...`);

                // Find best voice for this lang
                let availableVoices = this.synth.getVoices();
                if (availableVoices.length === 0) {
                    setTimeout(() => {
                        availableVoices = this.synth.getVoices();
                        this._applyVoice(utterance, availableVoices);
                        this.synth.speak(utterance);
                    }, 100);
                } else {
                    this._applyVoice(utterance, availableVoices);
                    this.synth.speak(utterance);
                }

                utterance.onend = () => {
                    this.isSpeaking = false;
                    this.isPaused = false;
                    this.updateUI();
                    this.hideStatus();
                };

                utterance.onerror = (e) => {
                    console.error('Speech error:', e);
                    this.isSpeaking = false;
                    this.updateUI();
                    this.hideStatus();
                };

                this.currentUtterance = utterance;
            }

            _applyVoice(utterance, voices) {
                const voice = voices.find(v => v.lang.startsWith(utterance.lang.split('-')[0])) || 
                              voices.find(v => v.lang.includes(utterance.lang));
                if (voice) {
                    utterance.voice = voice;
                    console.log(`[Narrator] Using voice: ${voice.name}`);
                } else {
                    console.warn(`[Narrator] No native voice found for ${utterance.lang}, using default.`);
                }
            }

            togglePlayPause() {
                if (this.isPaused) {
                    this.synth.resume();
                    this.isPaused = false;
                    this.showStatus('Narrating...');
                } else if (this.isSpeaking) {
                    this.synth.pause();
                    this.isPaused = true;
                    this.showStatus('Paused');
                }
                this.updateUI();
            }

            stop() {
                this.synth.cancel();
                this.isSpeaking = false;
                this.isPaused = false;
                this.currentUtterance = null;
                this.updateUI();
                this.hideStatus();
            }

            updateUI() {
                const icon = document.getElementById('audio-icon');
                const playPauseBtn = document.getElementById('narration-play-pause');
                const audioBtn = document.getElementById('audio-toggle');

                if (this.isSpeaking && !this.isPaused) {
                    icon.textContent = 'volume_up';
                    audioBtn.classList.add('bg-amber-600/40');
                    if (playPauseBtn) playPauseBtn.innerHTML = '⏸ Pause';
                } else if (this.isPaused) {
                    icon.textContent = 'volume_off';
                    audioBtn.classList.remove('bg-amber-600/40');
                    if (playPauseBtn) playPauseBtn.innerHTML = '▶ Resume';
                } else {
                    icon.textContent = 'volume_up';
                    audioBtn.classList.remove('bg-amber-600/40');
                    if (playPauseBtn) playPauseBtn.innerHTML = '▶ Play';
                }
            }

            showStatus(text) {
                const status = document.getElementById('narration-status');
                const statusText = document.getElementById('narration-status-text');
                if (status && statusText) {
                    statusText.textContent = text;
                    status.classList.add('visible');
                }
            }

            hideStatus() {
                const status = document.getElementById('narration-status');
                if (status) status.classList.remove('visible');
            }
        }

        // Initialize narrator
        const narrator = new NarrationManager();

        // Audio button toggles language panel
        document.getElementById('audio-toggle').onclick = (e) => {
            e.stopPropagation();
            const panel = document.getElementById('audio-lang-panel');
            panel.classList.toggle('open');
        };

        // Close language panel when clicking outside
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('audio-lang-panel');
            const btn = document.getElementById('audio-toggle');
            if (panel && !panel.contains(e.target) && !btn.contains(e.target)) {
                panel.classList.remove('open');
            }
        });

        // Ensure voices are loaded (some browsers load asynchronously)
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => {
                console.log('Voices loaded:', speechSynthesis.getVoices().length);
            };
        }

        // ── Splash Screen Logic ──
        const TEMPLE_INFO = {
            brihadeeswarar: { name: 'Brihadeeswarar Temple', location: 'Thanjavur, Tamil Nadu' },
            meenakshi: { name: 'Meenakshi Amman Temple', location: 'Madurai, Tamil Nadu' },
            shore: { name: 'Shore Temple', location: 'Mahabalipuram, Tamil Nadu' },
            nataraja: { name: 'Nataraja Temple', location: 'Chidambaram, Tamil Nadu' }
        };

        // Set splash temple name from URL param
        const splashInfo = TEMPLE_INFO[CURRENT_TEMPLE_ID] || TEMPLE_INFO.brihadeeswarar;
        document.getElementById('splash-temple-name').textContent = splashInfo.name;
        document.getElementById('splash-temple-location').textContent = splashInfo.location;

        // Generate floating particles for the splash
        (function createSplashParticles() {
            const container = document.getElementById('splash-particles');
            for (let i = 0; i < 30; i++) {
                const span = document.createElement('span');
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = (4 + Math.random() * 8) + 's';
                span.style.animationDelay = (Math.random() * 6) + 's';
                span.style.width = (1 + Math.random() * 3) + 'px';
                span.style.height = span.style.width;
                container.appendChild(span);
            }
        })();

        // Initialize the 3D scene in the background (but don't start narration yet)
        let journeyStarted = false;
        init();
        // Set initial phase visually only (no narration trigger)
        currentPhase = 2;
        document.querySelectorAll('.timeline-node').forEach((node, idx) => {
            node.classList.toggle('active', idx === 2);
        });

        function beginJourney() {
            journeyStarted = true;

            // Fade out splash
            const splash = document.getElementById('splash-overlay');
            splash.classList.add('fade-out');

            // Show the UI overlay
            const uiOverlay = document.getElementById('ui-overlay');
            uiOverlay.classList.remove('ui-hidden', 'pointer-events-none');
            uiOverlay.classList.add('ui-visible');

            // Remove splash from DOM after animation
            setTimeout(() => {
                splash.style.display = 'none';
            }, 800);

            // Start narration for the current era (user has clicked, so audio is allowed)
            setTimeout(() => {
                narrator.narrateEra(currentPhase);
            }, 500);
        }

    </script>
